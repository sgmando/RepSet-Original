<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>RepSet Tracker Preview</title>
  <style>
    :root{
      --black:#000000;
      --card:#121212;
      --card2:#1c1c1c;
      --red:#e50914;
      --red-dark:#8b0008;
      --white:#ffffff;
      --muted:#aaaaaa;
      --border:#2c2c2c;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--black);
      color:var(--white);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
    }

    .app{
      width:min(100%,480px);
      min-height:100vh;
      padding:18px 18px calc(18px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      background:var(--black);
    }

    .title{
      font-size:28px;
      font-weight:900;
      letter-spacing:.08em;
      margin:0;
    }

    .subtitle{
      margin-top:2px;
      font-size:14px;
      color:var(--muted);
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:16px;
    }

    .stat-card{
      height:138px;
      border-radius:20px;
      border:1px solid var(--border);
      background:var(--card);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .stat-label{
      font-size:15px;
      font-weight:800;
      color:var(--muted);
    }

    .stat-value{
      margin-top:2px;
      font-size:58px;
      line-height:1;
      font-weight:900;
    }

    button{
      width:100%;
      border:0;
      color:var(--white);
      font:inherit;
      cursor:pointer;
      user-select:none;
      touch-action:manipulation;
    }

    button:active{
      transform:scale(.985);
      filter:brightness(.92);
    }

    .rep,
    .complete,
    .set{
      min-height:92px;
      border-radius:22px;
      font-size:27px;
      font-weight:900;
    }

    .rep{
      margin-top:18px;
      background:var(--red);
      box-shadow:0 4px 14px rgba(229,9,20,.22);
    }

    .complete{
      margin-top:12px;
      background:var(--card);
      border:2px solid var(--red);
    }

    .set{
      margin-top:12px;
      background:var(--red-dark);
      border:none;
    }

    .corrections{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:14px;
    }

    .small{
      min-height:60px;
      border-radius:16px;
      background:var(--card2);
      border:1px solid #3e3e3e;
      font-size:18px;
      font-weight:900;
    }

    .spacer{flex:1;min-height:26px}

    .status{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      min-height:18px;
      margin-bottom:10px;
    }

    .reset{
      min-height:48px;
      border-radius:14px;
      background:var(--card);
      border:1px solid #323232;
      color:var(--red);
      font-size:14px;
      font-weight:900;
    }

    .dialog-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .dialog{
      width:min(100%,360px);
      border-radius:20px;
      background:#181818;
      border:1px solid #333;
      padding:20px;
    }

    .dialog h2{
      margin:0 0 8px;
      font-size:22px;
    }

    .dialog p{
      margin:0;
      color:#bbb;
      line-height:1.4;
    }

    .dialog-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }

    .cancel,.confirm{
      min-height:48px;
      border-radius:14px;
      font-weight:800;
    }

    .cancel{
      background:#2a2a2a;
    }

    .confirm{
      background:var(--red);
    }

    @media (max-height:740px){
      .stat-card{height:120px}
      .stat-value{font-size:50px}
      .rep,.complete,.set{min-height:78px}
      .small{min-height:54px}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title">REPSET</h1>
    <div class="subtitle">Fast gym counter • tap and keep moving</div>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-label">SETS</div>
        <div class="stat-value" id="setsValue">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">REPS</div>
        <div class="stat-value" id="repsValue">0</div>
      </div>
    </section>

    <button class="rep" id="repPlus">+ REP</button>
    <button class="complete" id="completeSet">COMPLETE SET</button>
    <button class="set" id="setPlus">+ SET</button>

    <section class="corrections">
      <button class="small" id="repMinus">− REP</button>
      <button class="small" id="setMinus">− SET</button>
    </section>

    <div class="spacer"></div>
    <div class="status" id="status">Ready</div>
    <button class="reset" id="resetWorkout">RESET WORKOUT</button>
  </main>

  <div class="dialog-backdrop" id="dialogBackdrop">
    <div class="dialog">
      <h2>Reset workout?</h2>
      <p>This will reset both sets and reps back to zero.</p>
      <div class="dialog-actions">
        <button class="cancel" id="cancelReset">Cancel</button>
        <button class="confirm" id="confirmReset">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const KEY_SETS = "repset_sets";
    const KEY_REPS = "repset_reps";

    let sets = Number(localStorage.getItem(KEY_SETS) || 0);
    let reps = Number(localStorage.getItem(KEY_REPS) || 0);

    const setsValue = document.getElementById("setsValue");
    const repsValue = document.getElementById("repsValue");
    const status = document.getElementById("status");
    const backdrop = document.getElementById("dialogBackdrop");

    function vibrate(){
      if (navigator.vibrate) navigator.vibrate(18);
    }

    function save(message){
      localStorage.setItem(KEY_SETS, sets);
      localStorage.setItem(KEY_REPS, reps);
      setsValue.textContent = sets;
      repsValue.textContent = reps;
      status.textContent = message;
      vibrate();
      clearTimeout(window.__statusTimer);
      window.__statusTimer = setTimeout(() => status.textContent = "Ready", 1200);
    }

    document.getElementById("repPlus").onclick = () => {
      reps++;
      save("Rep +1");
    };

    document.getElementById("completeSet").onclick = () => {
      sets++;
      reps = 0;
      save("Set logged • reps reset");
    };

    document.getElementById("setPlus").onclick = () => {
      sets++;
      save("Set +1");
    };

    document.getElementById("repMinus").onclick = () => {
      if (reps > 0) reps--;
      save("Rep −1");
    };

    document.getElementById("setMinus").onclick = () => {
      if (sets > 0) sets--;
      save("Set −1");
    };

    document.getElementById("resetWorkout").onclick = () => {
      backdrop.style.display = "flex";
    };

    document.getElementById("cancelReset").onclick = () => {
      backdrop.style.display = "none";
    };

    document.getElementById("confirmReset").onclick = () => {
      sets = 0;
      reps = 0;
      backdrop.style.display = "none";
      save("Workout reset");
    };

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) backdrop.style.display = "none";
    });

    save("Ready");
  </script>
</body>
</html>
